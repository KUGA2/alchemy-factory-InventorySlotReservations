name: Release mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Run tests and validate source
        run: |
          set -euo pipefail
          for test in slot_binding reservation_policy game_integration chestpull chestpull_integration; do
            luajit "tests/$test.lua"
          done
          for source in Scripts/*.lua; do
            luajit -b "$source" "/tmp/$(basename "$source").luac"
          done
          python3 -m json.tool mod.json >/dev/null
          bash -n tests/scripts/*.sh
      - name: Build and inspect release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tests/scripts/build-release.py --tag "$RELEASE_TAG"
          python3 tests/test_release_package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/InventorySlotReservations-*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Inventory Slot Reservations $RELEASE_TAG" --generate-notes
      - name: Determine Nexus version
        if: ${{ vars.NEXUSMODS_FILE_ID != '' }}
        id: nexus_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Upload new version to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/InventorySlotReservations-${{ steps.nexus_version.outputs.value }}.zip
          version: ${{ steps.nexus_version.outputs.value }}
          category: main
          update_mod_version: 'true'
